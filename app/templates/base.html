<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>{% block title %}海豹照片重捕核对{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">🦭 海豹照片重捕核对</a>

</main>
<footer class="foot">
  两轮闭种群照片重捕 · Chapman 估计 · 结论存 SQLite
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
