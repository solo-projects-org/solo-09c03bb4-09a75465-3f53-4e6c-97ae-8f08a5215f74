services:
  web:
    build: .
    image: seal-census-review:local
    container_name: seal-census-review
    ports:
      - "8000:8000"
    environment:
      SEAL_DB_PATH: /data/seals.db
    volumes:
      - seal-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  seal-data:
